<!DOCTYPE html>
<html>
<head>
<title>Sample Javascript IO Page</title>

<script>
function calculate() {
let PV = document.getElementById("fn").value;
let n = document.getElementById("sn").value;
let r = document.getElementById("tn").value;
let P = ((r/100/12) * PV) / (1-(1+(r/100/12))**-(n*12));
document.getElementById ("ans").innerHTML = "If you take out a loan of $" + PV + " with an interest rate of" + r + "%, you will have a month payment of $" + P.toFixed(2) + " over the course of " + n + " years.";
}

</script>
  
</head>
  <h3>Loan Payment Calculator</h3>

  <p>
  <input id="fn"> Present Value <br>
  <input id="sn"> Years <br>
  <input id="tn"> % Annual Interest Rate <br>
  <button onclick="calculate()"> Calculate Monthly Payment </button>
    
  </p>
  <p>
  Answer: <span id="ans"> ____________ </span>
  </p>

  
<body>
</body>
</html>
